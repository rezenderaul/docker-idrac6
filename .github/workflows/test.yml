name: test

on:
  push:
    branches: [main, master, "ci/*", "fix/*", "feat/*"]
  pull_request:

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install BATS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - name: Run BATS suite
        run: bats tests/bats/startapp.bats
